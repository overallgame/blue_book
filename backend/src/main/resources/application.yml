server:
  port: 8080

spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:3306/blue_book?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 3s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

app:
  jwt:
    secret: ${JWT_SECRET:default-jwt-secret-change-in-production}
    access-token-ttl: 86400000
    refresh-token-ttl: 604800000
  upload:
    image-max-size: 10485760
    video-max-size: 104857600
    chunk-size: 2097152
    storage-path: ${UPLOAD_PATH:./upload}

logging:
  level:
    root: INFO
    com.example.bluebook: DEBUG
  file:
    path: /var/log/blue-book
